<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="レシート台帳">
<meta name="theme-color" content="#0b6bcb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>レシート台帳</title>
<style>
  :root { --bg:#f2f4f7; --card:#fff; --ink:#1f2933; --sub:#667085; --pri:#0b6bcb; --ok:#1a7f4b; --err:#c0392b; --line:#d9dee5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1d242c; --ink:#e8edf2; --sub:#9aa7b4; --line:#33404d; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--ink);
         padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px); }
  header { background:var(--pri); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
           padding-top:calc(14px + env(safe-area-inset-top)); margin-top:calc(-1 * env(safe-area-inset-top)); }
  header h1 { font-size:17px; margin:0; }
  header button { background:transparent; color:#fff; font-size:22px; padding:0 4px; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  button { font:inherit; border:0; border-radius:12px; padding:12px 16px; background:var(--pri); color:#fff; }
  button.sub { background:var(--line); color:var(--ink); }
  button.big { width:100%; font-size:20px; padding:22px; }
  button:disabled { opacity:.5; }
  input, select { font:inherit; font-size:16px; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
                  background:var(--bg); color:var(--ink); }
  label { display:block; font-size:12px; color:var(--sub); margin:10px 0 3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .row { display:flex; gap:10px; margin-top:14px; }
  .row > * { flex:1; }
  #msg { display:none; padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; line-height:1.5; }
  #msg.ok { display:block; background:#e6f4ec; color:var(--ok); }
  #msg.err { display:block; background:#fdecea; color:var(--err); }
  #msg.info { display:block; background:#e8f1fb; color:var(--pri); }
  .low { border-color:var(--err); background:#fff6f5; color:#1f2933; }
  #preview { width:100%; max-height:55vh; object-fit:contain; background:#000; border-radius:8px; }
  .item { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .item:last-child { border:0; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; white-space:nowrap; align-self:center; }
  .tag.pending { background:#fff3cd; color:#8a6d00; } .tag.done { background:#e6f4ec; color:var(--ok); }
  small, .sub-text { color:var(--sub); font-size:12px; }
  h2 { font-size:15px; margin:0 0 6px; }
  a { color:var(--pri); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><h1>🧾 レシート台帳(タイ)</h1><button id="btnSettings" aria-label="設定">⚙︎</button></header>
<main>
  <div id="msg"></div>

  <section id="viewMain">
    <button class="big" id="btnShoot">📷 レシートを撮影</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <p class="sub-text" style="text-align:center">撮影 → 自動で読み取り → 確認して保存</p>

    <div class="card hidden" id="syncCard">
      <div id="syncText"></div>
      <div class="row"><button id="btnSync">今すぐ送信</button><button class="sub" id="btnLogin">Googleにログイン</button></div>
    </div>

    <div class="card">
      <h2>履歴(この iPhone 内)</h2>
      <div id="list"><small>まだありません</small></div>
    </div>
    <p style="text-align:center"><a id="sheetLink" href="#" target="_blank" class="hidden">📊 台帳スプレッドシートを開く</a></p>
  </section>

  <section id="viewReview" class="hidden">
    <div class="card">
      <img id="preview" alt="">
      <div class="grid2">
        <div><label>日付</label><input id="date" type="date"></div>
        <div><label>カテゴリ</label><select id="category"></select></div>
        <div><label>店名</label><input id="store_name"></div>
        <div><label>店名(原文)</label><input id="store_name_original"></div>
        <div><label>合計</label><input id="total" inputmode="decimal"></div>
        <div><label>通貨</label><input id="currency"></div>
        <div><label>小計(VAT抜き)</label><input id="subtotal" inputmode="decimal"></div>
        <div><label>VAT</label><input id="vat" inputmode="decimal"></div>
        <div><label>税ID</label><input id="tax_id" inputmode="numeric"></div>
        <div><label>レシート番号</label><input id="receipt_no"></div>
        <div><label>支払方法</label><input id="payment_method"></div>
        <div><label>内容</label><input id="items_summary"></div>
      </div>
      <label>メモ</label><input id="memo">
      <div class="row"><button id="btnSave">✅ 保存</button><button class="sub" id="btnCancel">破棄</button></div>
    </div>
  </section>

  <section id="viewSettings" class="hidden">
    <div class="card">
      <h2>設定</h2>
      <label>Anthropic API キー(この iPhone にだけ保存されます)</label>
      <input id="setKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <label>Google OAuth クライアント ID(Web アプリ用)</label>
      <input id="setClient" autocomplete="off" placeholder="xxxx.apps.googleusercontent.com">
      <label>Google アカウント(ログイン時の候補)</label>
      <input id="setEmail" type="email" autocomplete="off">
      <label>保存先フォルダ名(マイドライブ直下。無ければ作成)</label>
      <input id="setFolder">
      <p class="sub-text">リダイレクト URI(Google 側に登録する値): <br><b id="redirectUri"></b></p>
      <div class="row"><button id="btnSettingsSave">保存</button><button class="sub" id="btnSettingsBack">戻る</button></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
